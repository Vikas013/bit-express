spring:
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://127.0.0.1:27017/biteexpress}
  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI:mongodb://127.0.0.1:27017/biteexpress}
      auto-index-creation: true

app:
  default-tenant: ${APP_DEFAULT_TENANT:bite-express}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    resource: ${APP_SEED_RESOURCE:zomato.csv}