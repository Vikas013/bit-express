services:
  mongodb:
    image: mongo:8.0
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/biteexpress
      APP_SEED_ENABLED: "true"
      APP_SEED_RESOURCE: zomato.csv
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data: